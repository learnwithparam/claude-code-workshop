<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d">
  <title id="t">The review funnel: lenses hunt, verifiers vote, nits are capped</title>
  <desc id="d">A funnel in four layers. Lenses review the diff in parallel and reply with findings. A finding must name a file, a line and the evidence that breaks it. Three verifiers vote on each finding and two yes votes keep it. Nits are capped at three. If an important finding survives, the builder fixes it and the next round reviews only what changed, up to three rounds, after which a person takes over. A reply that is not a findings array fails the review.</desc>
  <style>
    text { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #171717; }
    .mono { font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; }
    .h { font-size: 16px; font-weight: 600; }
    .s { font-size: 14px; font-weight: 600; }
    .m { fill: #525252; }
    .card { fill: #ffffff; stroke: #d4d4d4; }
    .ln { stroke: #a3a3a3; stroke-width: 1.5; fill: none; }
    .ah { fill: #a3a3a3; }
    .model { fill: #e8f1fc; stroke: #0062d1; }
    .code { fill: #e7f5ea; stroke: #107d32; }
    .human { fill: #fdf1e3; stroke: #a35200; }
    .file { fill: #f3ebfc; stroke: #7d2fd0; }
    .fail { fill: #fdecec; stroke: #c4171c; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ededed; }
      .m { fill: #a1a1a1; }
      .card { fill: #0a0a0a; stroke: #3f3f3f; }
      .ln { stroke: #737373; }
      .ah { fill: #737373; }
      .model { fill: #0d2340; stroke: #52a8ff; }
      .code { fill: #0c2a16; stroke: #3fb950; }
      .human { fill: #33220a; stroke: #f5a623; }
      .file { fill: #261540; stroke: #bf7af0; }
      .fail { fill: #3a0e10; stroke: #ff6166; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="959" height="459" rx="12"/>
  <text class="h" x="24" y="34">One review round in <tspan class="mono">review.ts</tspan></text>

  <!-- funnel layers, each narrower -->
  <path class="model" d="M40 60H600L580 128H60Z"/>
  <text class="s" x="320" y="86" text-anchor="middle">Lenses hunt in parallel</text>
  <text class="m" x="320" y="106" text-anchor="middle">round 1: the whole diff. later rounds: only what changed</text>

  <path class="file" d="M60 136H580L560 204H80Z"/>
  <text class="s" x="320" y="162" text-anchor="middle">Each finding is a record</text>
  <text class="mono" x="320" y="182" text-anchor="middle">file, line, severity, claim, evidence</text>

  <path class="code" d="M80 212H560L540 280H100Z"/>
  <text class="s" x="320" y="238" text-anchor="middle">Three verifiers vote</text>
  <text class="m" x="320" y="258" text-anchor="middle">2 yes votes keep it, fewer drop it</text>

  <path class="code" d="M100 288H540L520 356H120Z"/>
  <text class="s" x="320" y="314" text-anchor="middle">Nits capped at 3</text>
  <text class="m" x="320" y="334" text-anchor="middle">style notes cannot bury the real bug</text>

  <rect class="file" x="200" y="372" width="240" height="40" rx="8"/>
  <text class="mono" x="320" y="397" text-anchor="middle">specs/&lt;n&gt;/review.json</text>
  <path class="ln" d="M320 356V370" marker-end="url(#a)"/>

  <!-- side rules: what drops out -->
  <path class="ln" d="M580 170H640" marker-end="url(#a)"/>
  <rect class="fail" x="642" y="146" width="290" height="48" rx="8"/>
  <text x="656" y="166">no evidence, no finding</text>
  <text class="m" x="656" y="184">a reply that is not JSON fails the review</text>

  <path class="ln" d="M550 246H640" marker-end="url(#a)"/>
  <rect class="card" x="642" y="222" width="290" height="48" rx="8"/>
  <text x="656" y="242">dropped: fewer than 2 votes</text>
  <text class="m" x="656" y="260">counted in <tspan class="mono">dropped</tspan>, never shown</text>

  <!-- after the round -->
  <path class="ln" d="M440 392H640" marker-end="url(#a)"/>
  <rect class="code" x="642" y="300" width="290" height="40" rx="8"/>
  <text x="656" y="325">no important finding left: clean</text>
  <rect class="model" x="642" y="350" width="290" height="40" rx="8"/>
  <text x="656" y="375">important left: the builder fixes, next round</text>
  <rect class="human" x="642" y="400" width="290" height="40" rx="8"/>
  <text x="656" y="425">still important after round 3: a person</text>
  <path class="ln" d="M600 392V320H640" marker-end="url(#a)"/>
  <path class="ln" d="M600 392V420H640" marker-end="url(#a)"/>
  <path class="ln" d="M932 370H948V94H602" marker-end="url(#a)"/>
  <text class="m" x="944" y="88" text-anchor="end">up to 3 rounds</text>
</svg>
