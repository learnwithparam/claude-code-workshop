<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 398" width="960" height="398" role="img" aria-labelledby="t d">
  <title id="t">Model routing by stage</title>
  <desc id="d">Each workflow step name maps through stepStages to a config stage, and the stage sets the model. Intent maps to triage on Haiku. Spec, plan and decide map to plan on Sonnet. Tests, build, fix and the other build steps map to build on Sonnet. Review maps to review on Sonnet. Ci, eval and reproduce map to verify on Haiku. Routes override this for an epic plan, which runs on Opus, and a docs build, which runs on Haiku. The docs workflow names its step write, which is unmapped, so it falls back to the middle model. Review lenses and verifiers take their model from frontmatter.</desc>
  <style>
    text { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #171717; }
    .mono { font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; }
    .h { font-size: 16px; font-weight: 600; }
    .s { font-size: 14px; font-weight: 600; }
    .m { fill: #525252; }
    .card { fill: #ffffff; stroke: #d4d4d4; }
    .ln { stroke: #a3a3a3; stroke-width: 1.5; fill: none; }
    .ah { fill: #a3a3a3; }
    .model { fill: #e8f1fc; stroke: #0062d1; }
    .code { fill: #e7f5ea; stroke: #107d32; }
    .human { fill: #fdf1e3; stroke: #a35200; }
    .file { fill: #f3ebfc; stroke: #7d2fd0; }
    .fail { fill: #fdecec; stroke: #c4171c; }
    .soon { stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ededed; }
      .m { fill: #a1a1a1; }
      .card { fill: #0a0a0a; stroke: #3f3f3f; }
      .ln { stroke: #737373; }
      .ah { fill: #737373; }
      .model { fill: #0d2340; stroke: #52a8ff; }
      .code { fill: #0c2a16; stroke: #3fb950; }
      .human { fill: #33220a; stroke: #f5a623; }
      .file { fill: #261540; stroke: #bf7af0; }
      .fail { fill: #3a0e10; stroke: #ff6166; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="959" height="397" rx="12"/>
  <text class="h" x="24" y="34">Which model runs each step</text>
  <text class="m" x="24" y="54">resolveModel() in models.ts: step name, then stepStages, then a route for the ticket type, then the stage model.</text>
  <text class="m" x="24" y="84">step name in the workflow</text>
  <text class="m" x="452" y="84">stepStages</text>
  <text class="m" x="644" y="84">config.json model</text>
  <rect class="card" x="24" y="96" width="400" height="34" rx="8"/>
  <text class="mono" x="40" y="118">intent</text>
  <path class="ln" d="M424 113H450" marker-end="url(#a)"/>
  <rect class="file" x="452" y="96" width="160" height="34" rx="8"/>
  <text class="mono" x="532" y="118" text-anchor="middle">triage</text>
  <path class="ln" d="M612 113H642" marker-end="url(#a)"/>
  <rect class="code" x="644" y="96" width="140" height="34" rx="8"/>
  <text class="s" x="714" y="118" text-anchor="middle">Haiku</text>
  <rect class="card" x="24" y="140" width="400" height="34" rx="8"/>
  <text class="mono" x="40" y="162">spec, plan, decide</text>
  <path class="ln" d="M424 157H450" marker-end="url(#a)"/>
  <rect class="file" x="452" y="140" width="160" height="34" rx="8"/>
  <text class="mono" x="532" y="162" text-anchor="middle">plan</text>
  <path class="ln" d="M612 157H642" marker-end="url(#a)"/>
  <rect class="model" x="644" y="140" width="140" height="34" rx="8"/>
  <text class="s" x="714" y="162" text-anchor="middle">Sonnet</text>
  <rect class="card" x="24" y="184" width="400" height="34" rx="8"/>
  <text class="mono" x="40" y="206">tests, build, fix, harden, refactor, bump, release</text>
  <path class="ln" d="M424 201H450" marker-end="url(#a)"/>
  <rect class="file" x="452" y="184" width="160" height="34" rx="8"/>
  <text class="mono" x="532" y="206" text-anchor="middle">build</text>
  <path class="ln" d="M612 201H642" marker-end="url(#a)"/>
  <rect class="model" x="644" y="184" width="140" height="34" rx="8"/>
  <text class="s" x="714" y="206" text-anchor="middle">Sonnet</text>
  <rect class="card" x="24" y="228" width="400" height="34" rx="8"/>
  <text class="mono" x="40" y="250">review</text>
  <path class="ln" d="M424 245H450" marker-end="url(#a)"/>
  <rect class="file" x="452" y="228" width="160" height="34" rx="8"/>
  <text class="mono" x="532" y="250" text-anchor="middle">review</text>
  <path class="ln" d="M612 245H642" marker-end="url(#a)"/>
  <rect class="model" x="644" y="228" width="140" height="34" rx="8"/>
  <text class="s" x="714" y="250" text-anchor="middle">Sonnet</text>
  <rect class="card" x="24" y="272" width="400" height="34" rx="8"/>
  <text class="mono" x="40" y="294">ci, eval, reproduce</text>
  <path class="ln" d="M424 289H450" marker-end="url(#a)"/>
  <rect class="file" x="452" y="272" width="160" height="34" rx="8"/>
  <text class="mono" x="532" y="294" text-anchor="middle">verify</text>
  <path class="ln" d="M612 289H642" marker-end="url(#a)"/>
  <rect class="code" x="644" y="272" width="140" height="34" rx="8"/>
  <text class="s" x="714" y="294" text-anchor="middle">Haiku</text>
  <text class="m" x="800" y="84">route overrides</text>
  <rect class="human" x="800" y="96" width="136" height="50" rx="8"/>
  <text class="mono" x="816" y="116">epic plan</text>
  <text class="s" x="816" y="136">Opus</text>
  <rect class="human" x="800" y="184" width="136" height="50" rx="8"/>
  <text class="mono" x="816" y="204">docs build</text>
  <text class="s" x="816" y="224">Haiku</text>
  <rect class="fail" x="24" y="324" width="444" height="54" rx="8"/>
  <text x="40" y="346">docs names its step write, which is in neither list,</text>
  <text x="40" y="366">so it falls back to the middle model and misses the route.</text>
  <rect class="card" x="492" y="324" width="444" height="54" rx="8"/>
  <text x="508" y="346">Lens and verifier calls in a review pass no model:</text>
  <text class="m" x="508" y="366">frontmatter decides, Sonnet lenses and a Haiku verifier.</text>
</svg>
