<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d">
  <title id="t">The checks, by size</title>
  <desc id="d">Three rows of checks. Small checks are fast and hermetic: red, lock, plan-drift and green. Medium checks run a test folder: acceptance, holdout, properties, behaviour-unchanged and contract. Large checks run the app, the model or the whole repo: mutation, visual, eval, gate and ci.</desc>
  <style>
    text { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #171717; }
    .mono { font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; }
    .h { font-size: 16px; font-weight: 600; }
    .s { font-size: 14px; font-weight: 600; }
    .m { fill: #525252; }
    .card { fill: #ffffff; stroke: #d4d4d4; }
    .ln { stroke: #a3a3a3; stroke-width: 1.5; fill: none; }
    .ah { fill: #a3a3a3; }
    .model { fill: #e8f1fc; stroke: #0062d1; }
    .code { fill: #e7f5ea; stroke: #107d32; }
    .human { fill: #fdf1e3; stroke: #a35200; }
    .file { fill: #f3ebfc; stroke: #7d2fd0; }
    .fail { fill: #fdecec; stroke: #c4171c; }
    .soon { stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ededed; }
      .m { fill: #a1a1a1; }
      .card { fill: #0a0a0a; stroke: #3f3f3f; }
      .ln { stroke: #737373; }
      .ah { fill: #737373; }
      .model { fill: #0d2340; stroke: #52a8ff; }
      .code { fill: #0c2a16; stroke: #3fb950; }
      .human { fill: #33220a; stroke: #f5a623; }
      .file { fill: #261540; stroke: #bf7af0; }
      .fail { fill: #3a0e10; stroke: #ff6166; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="959" height="339" rx="12"/>
  <text class="h" x="24" y="34">Checks by size</text>
  <text class="m" x="24" y="54">Every check in checks/index.ts declares a size. A workflow step lists the checks it must pass.</text>
  <rect class="code" x="24" y="76" width="190" height="60" rx="8"/>
  <text class="s" x="40" y="102">small</text>
  <text class="m" x="40" y="122">fast and hermetic</text>
  <rect class="card" x="234" y="88" width="46.2" height="36" rx="8"/>
  <text class="mono" x="257.1" y="111" text-anchor="middle">red</text>
  <rect class="card" x="290.2" y="88" width="53.6" height="36" rx="8"/>
  <text class="mono" x="317" y="111" text-anchor="middle">lock</text>
  <rect class="card" x="353.8" y="88" width="98" height="36" rx="8"/>
  <text class="mono" x="402.8" y="111" text-anchor="middle">plan-drift</text>
  <rect class="card" x="461.8" y="88" width="61" height="36" rx="8"/>
  <text class="mono" x="492.3" y="111" text-anchor="middle">green</text>
  <rect class="model" x="24" y="152" width="190" height="60" rx="8"/>
  <text class="s" x="40" y="178">medium</text>
  <text class="m" x="40" y="198">runs a test folder</text>
  <rect class="card" x="234" y="164" width="98" height="36" rx="8"/>
  <text class="mono" x="283" y="187" text-anchor="middle">acceptance</text>
  <rect class="card" x="342" y="164" width="75.80000000000001" height="36" rx="8"/>
  <text class="mono" x="379.9" y="187" text-anchor="middle">holdout</text>
  <rect class="card" x="427.8" y="164" width="98" height="36" rx="8"/>
  <text class="mono" x="476.8" y="187" text-anchor="middle">properties</text>
  <rect class="card" x="535.8" y="164" width="164.6" height="36" rx="8"/>
  <text class="mono" x="618.0999999999999" y="187" text-anchor="middle">behaviour-unchanged</text>
  <rect class="card" x="710.4" y="164" width="83.2" height="36" rx="8"/>
  <text class="mono" x="752" y="187" text-anchor="middle">contract</text>
  <rect class="human" x="24" y="228" width="190" height="60" rx="8"/>
  <text class="s" x="40" y="254">large</text>
  <text class="m" x="40" y="274">app, model or whole repo</text>
  <rect class="card" x="234" y="240" width="83.2" height="36" rx="8"/>
  <text class="mono" x="275.6" y="263" text-anchor="middle">mutation</text>
  <rect class="card" x="327.2" y="240" width="68.4" height="36" rx="8"/>
  <text class="mono" x="361.4" y="263" text-anchor="middle">visual</text>
  <rect class="card" x="405.6" y="240" width="53.6" height="36" rx="8"/>
  <text class="mono" x="432.40000000000003" y="263" text-anchor="middle">eval</text>
  <rect class="card" x="469.20000000000005" y="240" width="53.6" height="36" rx="8"/>
  <text class="mono" x="496.00000000000006" y="263" text-anchor="middle">gate</text>
  <rect class="card" x="532.8000000000001" y="240" width="38.8" height="36" rx="8"/>
  <text class="mono" x="552.2" y="263" text-anchor="middle">ci</text>
  <text class="m" x="24" y="320">A bigger check costs more time. Pick the smallest one that proves the claim.</text>
</svg>
