<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-labelledby="t d">
  <title id="t">Why a cloud session cannot push, and the ways out</title>
  <desc id="d">The cloned settings.json denies git push, so when the agent in a cloud session runs git push the permission rule refuses it. Three ways out follow: keep the deny and a person opens the pull request from the Changes card; keep the deny and teleport the session to a local checkout, run make check and push; or replace the deny with a tested hook that allows only factory branches, a change a person makes because the hook folder is protected.</desc>
  <style>
    text { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #171717; }
    .mono { font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; }
    .h { font-size: 16px; font-weight: 600; }
    .s { font-size: 14px; font-weight: 600; }
    .m { fill: #525252; }
    .card { fill: #ffffff; stroke: #d4d4d4; }
    .ln { stroke: #a3a3a3; stroke-width: 1.5; fill: none; }
    .ah { fill: #a3a3a3; }
    .model { fill: #e8f1fc; stroke: #0062d1; }
    .code { fill: #e7f5ea; stroke: #107d32; }
    .human { fill: #fdf1e3; stroke: #a35200; }
    .file { fill: #f3ebfc; stroke: #7d2fd0; }
    .fail { fill: #fdecec; stroke: #c4171c; }
    .soon { stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ededed; }
      .m { fill: #a1a1a1; }
      .card { fill: #0a0a0a; stroke: #3f3f3f; }
      .ln { stroke: #737373; }
      .ah { fill: #737373; }
      .model { fill: #0d2340; stroke: #52a8ff; }
      .code { fill: #0c2a16; stroke: #3fb950; }
      .human { fill: #33220a; stroke: #f5a623; }
      .file { fill: #261540; stroke: #bf7af0; }
      .fail { fill: #3a0e10; stroke: #ff6166; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="959" height="355" rx="12"/>
  <text class="h" x="24" y="34">The push belongs to a person</text>
  <text class="m" x="24" y="54">A cloud session clones the repo, so .claude/settings.json comes with it, deny list included.</text>
  <rect class="file" x="24" y="80" width="190" height="60" rx="8"/>
  <text class="mono" x="119" y="104" text-anchor="middle">.claude/settings.json</text>
  <text class="m" x="119" y="124" text-anchor="middle">in the clone</text>
  <path class="ln" d="M214 110H250" marker-end="url(#a)"/>
  <rect class="model" x="252" y="80" width="170" height="60" rx="8"/>
  <text x="337" y="104" text-anchor="middle">the agent runs</text>
  <text class="mono" x="337" y="124" text-anchor="middle">git push</text>
  <path class="ln" d="M422 110H458" marker-end="url(#a)"/>
  <rect class="fail" x="460" y="80" width="190" height="60" rx="8"/>
  <text x="555" y="104" text-anchor="middle">refused by the deny</text>
  <text class="mono" x="555" y="124" text-anchor="middle">Bash(git push *)</text>
  <text class="m" x="672" y="104">A session that cannot push</text>
  <text class="m" x="672" y="122">is the system working.</text>
  <path class="ln" d="M555 140V194H600" marker-end="url(#a)"/>
  <rect class="human" x="602" y="170" width="334" height="48" rx="8"/>
  <text class="s" x="618" y="190">Keep the deny, a person ships</text>
  <text class="m" x="618" y="208">read the Changes card, open the PR from claude.ai/code</text>
  <path class="ln" d="M555 140V252H600" marker-end="url(#a)"/>
  <rect class="human" x="602" y="228" width="334" height="48" rx="8"/>
  <text class="s" x="618" y="248">Keep the deny, teleport</text>
  <text class="m" x="618" y="266">claude --teleport, make check, push from your terminal</text>
  <path class="ln" d="M555 140V310H600" marker-end="url(#a)"/>
  <rect class="code" x="602" y="286" width="334" height="48" rx="8"/>
  <text class="s" x="618" y="306">Narrow the deny with a hook</text>
  <text class="m" x="618" y="324">allow factory/* branches only; a person edits the hook</text>
  <text x="24" y="200">Pick one and write it in AGENTS.md.</text>
  <text class="m" x="24" y="220">The default here is the first.</text>
</svg>
