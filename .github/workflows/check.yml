name: check
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"

# A newer push to the same PR replaces the run in flight; main and nightly runs always finish.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, check-latest: true, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: make check
      # The CLI judges the manifests; a missing binary fails the step instead of skipping it.
      - run: npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate plugins/factory-kit --strict
      - run: npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate . --strict

  # Each level is generated from trunk and must pass its own gate, so a fix on main
  # can never leave a learner's catch-up copy broken.
  levels:
    if: github.repository == 'learnwithparam/claude-code-workshop'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level:
          [
            hand-built,
            boundary,
            context,
            skills,
            execution,
            verification,
            delivery,
            sharing,
            workflows,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, check-latest: true, cache: npm }
      - run: npm ci
      - run: make levels LEVEL=${{ matrix.level }}
      - run: npm ci
        working-directory: supplied/${{ matrix.level }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: supplied/${{ matrix.level }}
      - run: make check
        working-directory: supplied/${{ matrix.level }}
