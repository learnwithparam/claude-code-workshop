name: watch

# Nightly: is the course still current? Opens one triage issue when a newer Claude Code exists.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the stamp with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp=$(grep -oE 'Claude Code [0-9]+\.[0-9]+\.[0-9]+' docs/versions.md | grep -oE '[0-9.]+$')
          latest=$(npm view @anthropic-ai/claude-code version)
          echo "stamp=$stamp latest=$latest"
          [ "$stamp" = "$latest" ] && exit 0
          open=$(gh issue list --label factory:triage --search "Claude Code $latest in:title" --json number --jq length)
          [ "$open" != "0" ] && exit 0
          gh issue create --label factory:triage \
            --title "Course check: Claude Code $latest is out" \
            --body "The course is stamped for $stamp. Re-run the checks against $latest, update docs/versions.md, the CI pin and the dev container, and note anything that changed."
