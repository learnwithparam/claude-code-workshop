# Method: behaviour-driven development, Gherkin scenarios agreed by product, dev and test (North, three amigos). Source: Cucumber docs.
name: feature-bdd
method: BDD with .feature files
source: Cucumber and the three amigos
for: user-facing behaviour
steps:
  - {
      stage: scenarios,
      agent: planner,
      writes: spec.md,
      startsWith: "Feature:",
      brief: "Write Gherkin scenarios for the ticket: Given, When, Then with concrete values, one behaviour each. Begin your reply with Feature: and reply with the scenarios only; the runner saves it as the spec, so a summary or a note about plan mode makes the spec unusable.",
    }
  - {
      stage: amigos,
      agent: test-reviewer,
      brief: "Read the scenarios as product, developer and tester. List missing cases and ambiguous steps. Change nothing.",
      gate: human,
    }
  - {
      stage: plan,
      writes: plan.md,
      agent: planner,
      brief: "Reply with the plan and nothing else: one repo path per line for every file you will create or change, never a script you only run. Do not list files under specs/<issue>/; the runner allows those. A new file needs an owner in levels.json, so list levels.json whenever you add a file. Commentary of any kind makes the plan unusable. The runner saves your reply as specs/<issue>/plan.md, and later stages may touch only the files listed.",
    }
  - {
      stage: red,
      agent: builder,
      brief: "Turn each scenario into a vitest test in specs/<issue>/golden that fails on the base commit because the behaviour is missing. Write no source.",
      checks: [red, lock],
      loop: { until: [red], max: 2 },
    }
  - {
      stage: build,
      agent: builder,
      brief: "Make the locked scenario tests pass with the smallest change in the files the plan lists. Never edit the tests.",
      phase: fix,
      checks: [acceptance, holdout, lock],
      loop: { until: [acceptance, holdout, lock], max: 4 },
    }
  - { stage: review, agent: reviewer, checks: [plan-drift] }
  - {
      stage: ci,
      agent: builder,
      brief: "Read the failing CI job log and fix what it names. Never edit the locked tests.",
      checks: [ci],
      loop: { until: [ci], max: 2 },
    }
