# Method: acceptance tests from agreed examples (Adzic, Specification by Example). Source: Anthropic AI-native SDLC playbook.
name: feature-atdd
method: ATDD, one test per AC example
source: Anthropic AI-native SDLC playbook
for: small features
steps:
  - { stage: intent, agent: planner }
  - { stage: spec, agent: planner, gate: human }
  - { stage: tests, agent: builder, checks: [red, lock], loop: { until: [red], max: 2 } }
  - {
      stage: build,
      agent: builder,
      phase: fix,
      checks: [acceptance, holdout, lock],
      loop: { until: [acceptance, holdout, lock], max: 4 },
    }
  - { stage: review, agent: reviewer, checks: [plan-drift] }
  - { stage: ci, agent: builder, checks: [ci], loop: { until: [ci], max: 2 } }
