# Method: consumer-driven contract. The recorded contract test comes first, then both sides move to meet it.
name: contract
method: contract test first
source: consumer-driven contracts
for: api and web boundary
steps:
  - {
      stage: plan,
      writes: plan.md,
      agent: planner,
      brief: "Reply with the plan and nothing else: one repo path per line for every file you will create or change. The runner saves your reply as specs/<issue>/plan.md, and later stages may touch only the files listed.",
    }
  - { stage: contract, agent: builder, checks: [red, lock], loop: { until: [red], max: 2 } }
  - {
      stage: sides,
      agent: builder,
      phase: fix,
      checks: [contract, lock, gate],
      loop: { until: [contract, lock, gate], max: 3 },
    }
  - { stage: review, agent: reviewer, checks: [plan-drift] }
