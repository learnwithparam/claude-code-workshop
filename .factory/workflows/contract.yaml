# Method: consumer-driven contract. The recorded contract test comes first, then both sides move to meet it.
name: contract
method: contract test first
source: consumer-driven contracts
for: api and web boundary
steps:
  - {
      stage: plan,
      writes: plan.md,
      agent: planner,
      brief: "Reply with the plan and nothing else: one repo path per line for every file you will create or change, never a script you only run. Do not list files under specs/<issue>/; the runner allows those. A new file needs an owner in levels.json, so list levels.json whenever you add a file. Commentary of any kind makes the plan unusable. The runner saves your reply as specs/<issue>/plan.md, and later stages may touch only the files listed.",
    }
  - {
      stage: contract,
      agent: builder,
      brief: "Write the contract test first in specs/<issue>/golden: it replays recorded events through both sides and fails on the base commit. Write no source.",
      checks: [red, lock],
      loop: { until: [red], max: 2 },
    }
  - {
      stage: sides,
      agent: builder,
      brief: "Change the api and the web side until the contract test passes. Never edit the test.",
      phase: fix,
      checks: [contract, lock, gate],
      loop: { until: [contract, lock, gate], max: 3 },
    }
  - { stage: review, agent: reviewer, checks: [plan-drift] }
