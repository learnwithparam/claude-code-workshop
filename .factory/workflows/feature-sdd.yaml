# Method: spec-driven development, constitution then specify then plan then tasks then analyze (GitHub Spec Kit; Kiro EARS requirements with approval between phases).
name: feature-sdd
method: SDD with phase gates and properties
source: Spec Kit and Kiro
for: large features and epics
steps:
  - {
      stage: intent,
      agent: planner,
      writes: intent.md,
      brief: "State the outcome the epic must reach and how we will know, in a few lines. Reply with the intent only.",
    }
  - {
      stage: constitution,
      agent: planner,
      writes: constitution.md,
      brief: "List the standing rules this feature must obey, one per line, taken from AGENTS.md and .claude/rules (testing, security, file size, naming). Reply with the rules only.",
    }
  - {
      stage: spec,
      agent: planner,
      writes: spec.md,
      gate: human,
      startsWith: "R1.",
      brief: "Write EARS requirements, one per line as 'R<n>. When <trigger>, the system shall <response>'. Start your reply with 'R1.' and reply with the requirements only: no commentary, no plan-mode notes, do not run the gate.",
    }
  - {
      stage: clarify,
      agent: planner,
      writes: clarify.md,
      brief: "List every requirement in specs/<issue>/spec.md that two readers could build differently, each with the single reading the plan will assume. Reply with that list only, or the single line 'No ambiguity.'",
    }
  - {
      stage: plan,
      agent: planner,
      writes: plan.md,
      gate: human,
      brief: "Reply with the plan and nothing else: one repo path per line for every file you will create or change, never a script you only run. Do not list files under specs/<issue>/; the runner allows those. A new file needs an owner in levels.json, so list levels.json whenever you add a file. Commentary of any kind makes the plan unusable. The runner saves your reply as specs/<issue>/plan.md, and later stages may touch only the files listed.",
      checks: [plan-drift],
    }
  - {
      stage: tasks,
      agent: planner,
      writes: tasks.md,
      brief: "Break the plan into small ordered tasks, one per line as 'T<n>. <task> (R<n>)', each naming the requirement it serves. Reply with the tasks only.",
    }
  - {
      stage: analyze,
      agent: planner,
      writes: analyze.md,
      brief: "Cross-check spec.md, clarify.md, plan.md and tasks.md. List every requirement with no task, every task with no requirement and every plan file no task touches. Reply with the findings only, or the single line 'Consistent.'",
    }
  - {
      stage: tests,
      agent: builder,
      brief: "Write a vitest test or fast-check property for each requirement in specs/<issue>/golden, following specs/<issue>/tasks.md. They fail on the base commit. Write no source.",
      checks: [red, properties, lock],
      loop: { until: [red], max: 2 },
    }
  - {
      stage: build,
      agent: builder,
      brief: "Make the locked tests and properties pass with the smallest change in the files the plan lists. Never edit the tests.",
      phase: fix,
      checks: [acceptance, properties, lock],
      loop: { until: [acceptance, properties, lock], max: 5 },
    }
  - {
      stage: harden,
      agent: test-reviewer,
      brief: "Strengthen the tests so mutants in the files this run changed are killed. Add tests under specs/<issue>/golden; never change source.",
      checks: [mutation],
    }
  - {
      stage: review,
      agent: reviewer,
      review: { lenses: [reviewer, security-reviewer, test-reviewer] },
      checks: [plan-drift],
    }
  - {
      stage: release,
      agent: builder,
      brief: "Read the failing CI job log and fix what it names. Never edit the locked tests.",
      checks: [ci],
      loop: { until: [ci], max: 2 },
    }
