# Method: docs are checked like code: prose rules and links, in the same gate.
name: docs
method: prose check
source: engineering standard
for: documentation
steps:
  - { stage: plan, writes: plan.md, agent: planner }
  - {
      stage: write,
      agent: builder,
      brief: "Fix the drift the ticket names in the docs the plan lists. Prefer regenerating a generated file with its script over editing it by hand. No em dashes, no filler.",
      checks: [prose, gate],
      loop: { until: [prose, gate], max: 3 },
    }
  - {
      stage: review,
      agent: reviewer,
      review: { lenses: [reviewer, security-reviewer, test-reviewer] },
      checks: [plan-drift],
    }
