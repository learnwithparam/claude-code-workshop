# Method: docs are checked like code: prose rules and links, in the same gate.
name: docs
method: prose check
source: engineering standard
for: documentation
steps:
  - {
      stage: plan,
      writes: plan.md,
      agent: planner,
      brief: "Reply with the plan and nothing else: one repo path per line for every file you will create or change, never a script you only run. Do not list files under specs/<issue>/; the runner allows those. The runner saves your reply as specs/<issue>/plan.md, and later stages may touch only the files listed.",
    }
  - {
      stage: write,
      agent: builder,
      brief: "Fix the drift the ticket names in the docs the plan lists. Prefer regenerating a generated file with its script over editing it by hand. No em dashes, no filler.",
      checks: [prose, gate],
      loop: { until: [prose, gate], max: 3 },
    }
  - { stage: review, agent: reviewer, checks: [plan-drift] }
