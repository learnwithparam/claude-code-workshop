# Method: docs are checked like code: prose rules and links, in the same gate.
name: docs
method: prose check
source: engineering standard
for: documentation
steps:
  - {
      stage: plan,
      agent: planner,
      brief: "Write specs/<issue>/plan.md: one repo path per line for every file you will create or change. Later stages may touch only those files.",
    }
  - { stage: write, agent: builder, checks: [prose, gate], loop: { until: [prose, gate], max: 3 } }
  - { stage: review, agent: reviewer, checks: [plan-drift] }
