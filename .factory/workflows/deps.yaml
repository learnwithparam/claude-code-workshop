# Method: a dependency change is vetted, then proved by the whole gate, never by the bump alone.
name: deps
method: vet then gate
source: Anthropic AI-native SDLC playbook
for: dependency updates
steps:
  - {
      stage: vet,
      agent: security-reviewer,
      writes: intent.md,
      brief: "For each package named in the ticket, report its age, maintainer and whether a sibling app pins another major version. Reply with the findings only.",
    }
  - {
      stage: plan,
      writes: plan.md,
      agent: planner,
      brief: "Reply with the plan and nothing else: one repo path per line for every file you will create or change. The runner saves your reply as specs/<issue>/plan.md, and later stages may touch only the files listed.",
    }
  - {
      stage: bump,
      agent: builder,
      brief: "Bump only the packages the plan lists with npm, fix any breakage the bump causes, and keep the lockfile in step.",
      checks: [gate],
      loop: { until: [gate], max: 3 },
    }
  - { stage: review, agent: reviewer, checks: [plan-drift] }
