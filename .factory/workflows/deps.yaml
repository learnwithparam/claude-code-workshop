# Method: a dependency change is vetted, then proved by the whole gate, never by the bump alone.
name: deps
method: vet then gate
source: Anthropic AI-native SDLC playbook
for: dependency updates
steps:
  - { stage: vet, agent: security-reviewer }
  - {
      stage: plan,
      agent: planner,
      brief: "Write specs/<issue>/plan.md: one repo path per line for every file you will create or change. Later stages may touch only those files.",
    }
  - { stage: bump, agent: builder, checks: [gate], loop: { until: [gate], max: 3 } }
  - { stage: review, agent: reviewer, checks: [plan-drift] }
