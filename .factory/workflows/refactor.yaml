# Method: characterization tests first (Feathers), then change structure while behaviour stays pinned.
name: refactor
method: characterization then behaviour-unchanged
source: Working Effectively with Legacy Code
for: refactors
steps:
  - {
      stage: characterize,
      agent: builder,
      brief: "Do not change source. Write vitest golden tests in specs/<issue>/golden that record the current output of the code named in the ticket, so they pass on the base commit.",
      checks: [behaviour-unchanged, lock],
    }
  - {
      stage: refactor,
      agent: builder,
      brief: "Make the structural change the ticket asks for. Never edit the golden tests; they must keep passing.",
      phase: fix,
      checks: [behaviour-unchanged, lock, gate],
      loop: { until: [behaviour-unchanged, lock, gate], max: 4 },
    }
  - {
      stage: harden,
      agent: test-reviewer,
      brief: "Strengthen the tests so mutants in the files this run changed are killed. Add tests under specs/<issue>/golden; never change source.",
      checks: [mutation],
      loop: { until: [mutation], max: 3 },
    }
  - { stage: review, agent: reviewer, checks: [plan-drift] }
