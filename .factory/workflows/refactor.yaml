# Method: characterization tests first (Feathers), then change structure while behaviour stays pinned.
name: refactor
method: characterization then behaviour-unchanged
source: Working Effectively with Legacy Code
for: refactors
steps:
  - { stage: characterize, agent: builder, checks: [behaviour-unchanged, lock] }
  - {
      stage: refactor,
      agent: builder,
      phase: fix,
      checks: [behaviour-unchanged, lock, gate],
      loop: { until: [behaviour-unchanged, lock, gate], max: 4 },
    }
  - { stage: harden, agent: test-reviewer, checks: [mutation] }
  - { stage: review, agent: reviewer, checks: [plan-drift] }
